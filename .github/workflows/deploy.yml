name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Builds the site and uploads it. The steps below can still stop the deploy.
      - uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        with:
          node-version: 24
          package-manager: pnpm@11.20.0

      - name: Test the content check
        run: node --test scripts/check.test.mjs

      # Preview mode tolerates pending items. Remove --preview when launching for real.
      - name: Check the built site
        run: node scripts/check.mjs --root dist --preview
        env:
          # A secret, not a variable: step env is printed in public logs and only secrets are masked.
          CHECK_EXTRA_TERMS: ${{ secrets.CHECK_EXTRA_TERMS }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
